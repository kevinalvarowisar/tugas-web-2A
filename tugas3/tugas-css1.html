<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tugas CSS</title>

    <style>
      body {
        background-color: #eaf4ff;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }

      .container {
        width: 80%;
        max-width: 600px;
        margin: 100px auto;
        background-color: white;
        padding: 30px;
        text-align: center;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
      }

      h1 {
        color: #1565c0;
        margin-bottom: 10px;
      }

      p {
        color: #333333;
        font-size: 18px;
      }

      .nama {
        color: #e91e63;
        font-weight: bold;
      }

      .kota {
        color: #00897b;
        font-weight: bold;
      }

      .info {
        background-color: #f1f8e9;
        padding: 15px;
        border-radius: 10px;
        margin-top: 20px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Profil Mahasiswa</h1>

      <p>
        Nama saya adalah
        <span class="nama">Kevin Alvaro Wisar</span>
      </p>

      <div class="info">
        <p>
          Saya berasal dari kota
          <span class="kota">Kediri</span>.
        </p>
      </div>
    </div>
  </body>
</html>
