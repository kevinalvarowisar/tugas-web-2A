<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KASIR-JS</title>
</head>
<body>

    <script>
        // 1. Mengambil input via pop-up prompt
        let nama = prompt("Masukkan nama barang:");
        let harga = parseFloat(prompt("Masukkan harga barang:"));
        let qty = parseInt(prompt("Masukkan jumlah beli (qty):"));

        // 2. Perhitungan total dan diskon (> 50.000 dapat diskon 10%)
        let totalBelanja = harga * qty;
        let diskon = 0;

        if (totalBelanja > 50000) {
            diskon = totalBelanja * 0.10;
        }

        let pembayaran = totalBelanja - diskon;

        // 3. Format angka ke gaya Indonesia
        let fHarga = harga.toLocaleString('id-ID');
        let fTotal = totalBelanja.toLocaleString('id-ID');
        let fDiskon = diskon.toLocaleString('id-ID');
        let fBayar = pembayaran.toLocaleString('id-ID');

        // 4. Menampilkan struk ke halaman web menggunakan document.write dan <pre>
        document.write("<pre>");
        document.write("++++++++++++++++++++++++++++++++++++++\n");
        document.write("+                                    +\n");
        document.write("+  nama      Harga   qty   total     +\n");
        document.write("+  " + nama.padEnd(10) + "  " + fHarga.padEnd(7) + "  " + qty.toString().padEnd(3) + "   " + fTotal.padEnd(8) + " +\n");
        document.write("+                                    +\n");
        document.write("+  total belanja   " + fTotal.padEnd(10) + " +\n");
        document.write("+  diskon          " + fDiskon.padEnd(10) + " +\n");
        document.write("+  pembayaran      " + fBayar.padEnd(10) + " +\n");
        document.write("+                                    +\n");
        document.write("++++++++++++++++++++++++++++++++++++++");
        document.write("</pre>");
    </script>

</body>
</html>
