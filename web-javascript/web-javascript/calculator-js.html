<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>
</head>
<body>
    <h1>Kalkulator Sederhana</h1>

    <script>
        // Mengambil input dan langsung mengubahnya menjadi tipe data angka (parseFloat / Number)
        let angka1 = parseFloat(prompt("Masukkan angka pertama:"));
        let angka2 = parseFloat(prompt("Masukkan angka kedua:"));
        
        let penjumlahan = parseFloat(angka1) + parseFloat(angka2);

        document.write("hasil penjumlahan: " + penjumlahan);
        

    </script>
</body>
</html>
